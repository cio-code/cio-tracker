<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documents · Faculty Load Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="font-sans">

<div id="shell"></div>

<main class="max-w-6xl mx-auto px-4 py-6 space-y-4">
  <div class="grid sm:grid-cols-5 gap-3">
    <input id="fQ" class="sm:col-span-2" placeholder="Search number, program, faculty, submitter" aria-label="Search">
    <select id="fType" aria-label="Document type">
      <option value="">All types</option><option>Faculty Load</option><option>DLP</option>
    </select>
    <select id="fCampus" aria-label="Campus"></select>
    <select id="fStatus" aria-label="Status">
      <option value="Pending">Still in the office</option>
      <option value="">All statuses</option>
      <option>Received</option><option>Processing</option><option>For Signature</option>
      <option>Returned</option><option>Released</option>
    </select>
  </div>

  <div class="bg-white border border-[#c9d3cd] rounded-lg overflow-x-auto">
    <table class="w-full text-sm">
      <thead class="bg-pine-soft text-left">
        <tr><th class="p-3">Number</th><th class="p-3">Campus / Program</th><th class="p-3">Faculty / Submitted by</th>
            <th class="p-3">Received</th><th class="p-3">Status</th><th class="p-3">With</th></tr>
      </thead>
      <tbody id="docRows"></tbody>
    </table>
  </div>
  <p id="docEmpty" class="text-sm text-[#4b5b54] hidden">No documents match. Change the filters or receive a new document.</p>
</main>

<!-- Detail drawer: history, update status, release -->
<div id="drawer" class="hidden fixed inset-0 z-40 noprint">
  <div class="absolute inset-0 bg-black/40" id="drawerBg"></div>
  <aside class="absolute right-0 top-0 h-full w-full max-w-md bg-white p-5 overflow-y-auto space-y-5">
    <div class="flex items-start justify-between gap-3">
      <div><div id="dNo" class="text-xl font-bold tabnum"></div><div id="dStatus"></div></div>
      <button id="dClose" class="btn-ghost">Close</button>
    </div>
    <dl id="dInfo" class="text-sm grid grid-cols-3 gap-y-1.5"></dl>
    <div>
      <h3 class="font-semibold mb-2">History</h3>
      <ol id="dTimeline" class="text-sm border-l-2 border-pine-soft pl-4 space-y-3"></ol>
    </div>
    <div id="dActions" class="space-y-5"></div>
    <p id="dError" class="text-sm text-red-700 hidden"></p>
  </aside>
</div>

<div id="toast" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 bg-ink text-white text-sm px-4 py-2 rounded-md z-50"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/documents.js"></script>
</body>
</html>
