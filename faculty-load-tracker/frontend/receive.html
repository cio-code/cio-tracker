<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receive a document · Document Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js?v=5"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="font-sans">

<div id="shell"></div>

<main class="max-w-6xl mx-auto px-4 py-6">
  <h1 class="text-xl font-bold mb-4">Receive a document</h1>

  <!-- Choose what kind of document this is. The form below changes to match. -->
  <div class="bg-white border border-[#c9d3cd] rounded-lg p-5 max-w-4xl mb-5">
    <label for="rType">Document type</label>
    <select id="rType"></select>
    <p id="typeHint" class="hidden text-sm text-amber2 mt-2"></p>
  </div>

  <form id="receiveForm" class="space-y-5 max-w-4xl">

    <section class="bg-white border border-[#c9d3cd] rounded-lg p-5 grid md:grid-cols-2 gap-4">
      <div><label for="rCampus">Campus</label><select id="rCampus" required></select></div>
      <div><label for="rDept">Department</label><select id="rDept" required></select></div>
      <div><label for="rSem">Semester</label>
        <select id="rSem"><option>1st Semester</option><option>2nd Semester</option><option>Summer</option></select></div>
      <div><label for="rSY">School year</label><input id="rSY" placeholder="2026-2027" required></div>
      <div class="md:col-span-2"><label for="rSource">Submitted by</label>
        <input id="rSource" placeholder="Name of the dean, department head or staff who handed it in" required></div>
    </section>

    <section class="bg-white border border-[#c9d3cd] rounded-lg p-5">
      <h2 class="font-semibold mb-2">Attachments received</h2>
      <div id="attList" class="grid gap-2 text-sm"></div>
    </section>

    <section class="bg-white border border-[#c9d3cd] rounded-lg p-5">
      <h2 class="font-semibold mb-3">Faculty submissions</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="text-left">
            <tr>
              <th class="pb-2 pr-2">Faculty name</th>
              <th class="pb-2 pr-2">Program</th>
              <th class="pb-2 pr-2">Major</th>
              <th class="pb-2 px-2 text-center">Faculty Load<br><button type="button" id="allFL" class="font-normal underline text-xs">tick all</button></th>
              <th class="pb-2 px-2 text-center">IDP<br><button type="button" id="allIDP" class="font-normal underline text-xs">tick all</button></th>
              <th class="pb-2"></th>
            </tr>
          </thead>
          <tbody id="lineRows"></tbody>
        </table>
      </div>
      <div class="flex flex-wrap gap-2 mt-3">
        <button type="button" class="btn-ghost" id="addRowBtn">Add faculty</button>
        <button type="button" class="btn-ghost" id="pasteToggle">Paste a list of names</button>
      </div>
      <div id="pasteBox" class="hidden mt-3 space-y-2">
        <label for="pasteNames">One name per line</label>
        <textarea id="pasteNames" rows="5" placeholder="Vicpher D. Garnada&#10;Zenon A. Matos Jr."></textarea>
        <button type="button" class="btn-ghost" id="pasteAdd">Add these names</button>
      </div>
    </section>

    <section class="bg-white border border-[#c9d3cd] rounded-lg p-5">
      <label for="rRemarks">Remarks</label><textarea id="rRemarks" rows="2"></textarea>
    </section>

    <p id="rError" class="text-sm text-red-700 hidden"></p>
    <button class="btn" id="rBtn">Save as received</button>
  </form>

  <!-- Receipt shown after saving -->
  <div id="slipWrap" class="hidden max-w-3xl">
    <div id="slip" class="bg-white border-2 border-pine rounded-lg p-6">
      <div class="text-sm text-[#4b5b54]">Received. Write this number on the transmittal.</div>
      <div id="slipNo" class="text-3xl md:text-4xl font-bold tabnum my-2"></div>
      <div id="slipInfo" class="text-sm space-y-0.5"></div>
      <table class="w-full text-sm border border-[#c9d3cd] mt-4">
        <thead><tr class="text-left"><th class="border border-[#c9d3cd] p-2">Faculty name</th><th class="border border-[#c9d3cd] p-2">Program / Major</th>
          <th class="border border-[#c9d3cd] p-2 text-center">Faculty Load</th><th class="border border-[#c9d3cd] p-2 text-center">IDP</th></tr></thead>
        <tbody id="slipLines"></tbody>
      </table>
    </div>
    <div class="flex gap-2 mt-3 noprint">
      <button class="btn" onclick="window.print()">Print receipt</button>
      <button class="btn-ghost" id="anotherBtn">Receive another</button>
    </div>
  </div>

  <!-- ===== Other documents (memorandum, letters, orders...) ===== -->
  <form id="oForm" class="hidden bg-white border border-[#c9d3cd] rounded-lg p-5 grid md:grid-cols-2 gap-4 max-w-4xl">
    <div><label for="oCampus">Campus</label><select id="oCampus" required></select></div>
    <div><label for="oDept">Office / department</label><input id="oDept" list="oDeptList" placeholder="Choose or type an office" required><datalist id="oDeptList"></datalist></div>
    <div class="md:col-span-2"><label for="oTitle">Title / subject</label><input id="oTitle" maxlength="200" required></div>
    <div><label for="oRef">Reference no. (optional)</label><input id="oRef" placeholder="e.g. MEMO-12, S. 2026"></div>
    <div><label for="oSource">Received from</label><input id="oSource" placeholder="Person or office that sent / handed it in" required></div>
    <div class="md:col-span-2"><label for="oRemarks">Remarks</label><textarea id="oRemarks" rows="2"></textarea></div>
    <p id="oError" class="md:col-span-2 text-sm text-red-700 hidden"></p>
    <div class="md:col-span-2"><button class="btn" id="oBtn">Save as received</button></div>
  </form>

  <div id="oSlipWrap" class="hidden max-w-3xl">
    <div id="oSlip" class="bg-white border-2 border-pine rounded-lg p-6">
      <div class="text-sm text-[#4b5b54]">Received. Write this number on the document.</div>
      <div id="oSlipNo" class="text-3xl md:text-4xl font-bold tabnum my-2"></div>
      <div id="oSlipInfo" class="text-sm space-y-0.5"></div>
    </div>
    <div class="flex gap-2 mt-3 noprint">
      <button class="btn" onclick="window.print()">Print slip</button>
      <button class="btn-ghost" id="oAnother">Receive another</button>
    </div>
  </div>
</main>

<div id="toast" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 bg-ink text-white text-sm px-4 py-2 rounded-md z-50"></div>

<script src="js/config.js?v=5"></script>
<script src="js/api.js?v=5"></script>
<script src="js/ui.js?v=5"></script>
<script src="js/receive.js?v=5"></script>
</body>
</html>
