<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receive a document · Faculty Load Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="font-sans">

<div id="shell"></div>

<main class="max-w-6xl mx-auto px-4 py-6">

  <form id="receiveForm" class="bg-white border border-[#c9d3cd] rounded-lg p-5 grid md:grid-cols-2 gap-4 max-w-3xl">
    <div><label for="rCampus">Campus</label><select id="rCampus" required></select></div>
    <div><label for="rDept">Department</label><select id="rDept" required></select></div>
    <div class="md:col-span-2"><label for="rProgram">Program</label><select id="rProgram" required></select></div>
    <div><label for="rMajor">Major</label><select id="rMajor"></select></div>
    <div><label for="rFaculty">Faculty name (blank for a whole-department batch)</label><input id="rFaculty"></div>
    <div><label for="rSem">Semester</label>
      <select id="rSem"><option>1st Semester</option><option>2nd Semester</option><option>Summer</option></select></div>
    <div><label for="rSY">School year</label><input id="rSY" placeholder="2026-2027" required></div>
    <div class="md:col-span-2"><label for="rSource">Submitted by</label>
      <input id="rSource" placeholder="Name of the dean, department head or staff who handed it in" required></div>
    <div class="md:col-span-2"><label for="rRemarks">Remarks</label><textarea id="rRemarks" rows="2"></textarea></div>
    <p id="rError" class="md:col-span-2 text-sm text-red-700 hidden"></p>
    <div class="md:col-span-2"><button class="btn" id="rBtn">Save as received</button></div>
  </form>

  <!-- Routing slip, shown after saving -->
  <div id="slipWrap" class="hidden max-w-3xl">
    <div id="slip" class="bg-white border-2 border-pine rounded-lg p-6">
      <div class="text-sm text-[#4b5b54]">Received. Write this number on the document.</div>
      <div id="slipNo" class="text-3xl md:text-4xl font-bold tabnum my-2"></div>
      <div id="slipInfo" class="text-sm space-y-0.5"></div>
    </div>
    <div class="flex gap-2 mt-3 noprint">
      <button class="btn" onclick="window.print()">Print slip</button>
      <button class="btn-ghost" id="anotherBtn">Receive another</button>
    </div>
  </div>
</main>

<div id="toast" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 bg-ink text-white text-sm px-4 py-2 rounded-md z-50"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/receive.js"></script>
</body>
</html>
