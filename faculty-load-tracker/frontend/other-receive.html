<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receive other document · Document Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="font-sans">

<div id="shell"></div>

<main class="max-w-6xl mx-auto px-4 py-6">
  <h1 class="text-xl font-bold mb-4">Receive other document</h1>

  <form id="receiveForm" class="bg-white border border-[#c9d3cd] rounded-lg p-5 grid md:grid-cols-2 gap-4 max-w-3xl">
    <div><label for="rType">Document type</label><select id="rType" required></select></div>
    <div><label for="rCampus">Campus</label><select id="rCampus" required></select></div>
    <div class="md:col-span-2"><label for="rTitle">Title / subject</label><input id="rTitle" maxlength="200" required></div>
    <div><label for="rRef">Reference no. (optional)</label><input id="rRef" placeholder="e.g. MEMO-12, S. 2026"></div>
    <div><label for="rDept">Office / department</label><input id="rDept" list="deptList" placeholder="Choose or type an office" required><datalist id="deptList"></datalist></div>
    <div class="md:col-span-2"><label for="rSource">Received from</label>
      <input id="rSource" placeholder="Person or office that sent / handed it in" required></div>
    <div class="md:col-span-2"><label for="rRemarks">Remarks</label><textarea id="rRemarks" rows="2"></textarea></div>
    <p id="rError" class="md:col-span-2 text-sm text-red-700 hidden"></p>
    <div class="md:col-span-2"><button class="btn" id="rBtn">Save as received</button></div>
  </form>

  <div id="slipWrap" class="hidden max-w-3xl">
    <div id="slip" class="bg-white border-2 border-pine rounded-lg p-6">
      <div class="text-sm text-[#4b5b54]">Received. Write this number on the document.</div>
      <div id="slipNo" class="text-3xl md:text-4xl font-bold tabnum my-2"></div>
      <div id="slipInfo" class="text-sm space-y-0.5"></div>
    </div>
    <div class="flex gap-2 mt-3 noprint">
      <button class="btn" onclick="window.print()">Print slip</button>
      <button class="btn-ghost" id="anotherBtn">Receive another</button>
    </div>
  </div>
</main>

<div id="toast" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 bg-ink text-white text-sm px-4 py-2 rounded-md z-50"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/other-receive.js"></script>
</body>
</html>
