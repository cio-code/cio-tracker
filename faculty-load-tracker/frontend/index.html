<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Faculty Load Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="font-sans">

<main class="min-h-screen flex items-center justify-center p-4">
  <form id="loginForm" class="bg-white border border-[#c9d3cd] rounded-lg p-6 w-full max-w-sm space-y-4">
    <div>
      <h1 class="text-xl font-bold">Faculty Load Tracker</h1>
      <p class="text-sm text-[#4b5b54]">Sign in to log documents received and released.</p>
    </div>
    <div><label for="lgName">Name</label><input id="lgName" autocomplete="username" required></div>
    <div><label for="lgPin">PIN</label><input id="lgPin" type="password" inputmode="numeric" autocomplete="current-password" required></div>
    <p id="lgError" class="text-sm text-red-700 hidden"></p>
    <button class="btn w-full" id="lgBtn">Sign in</button>
  </form>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/login.js"></script>
</body>
</html>
